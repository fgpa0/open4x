# Builds the game for Linux, Windows and macOS and publishes a GitHub release.
# Run it by pushing a version tag:  git tag v0.1.0 && git push origin v0.1.0
# (or from the Actions tab, for a tag that already exists).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
          - os: macos-14
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          lfs: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Test
        run: cargo test --workspace --release

      - name: Build
        run: cargo build --release -p client

      # The game reads its rules from a `data` folder beside the executable,
      # so players can mod them; models, fonts and shaders are built in.
      - name: Package
        shell: bash
        run: |
          dir="open4x-$TAG-${{ matrix.name }}"
          mkdir -p "$dir/data"
          cp data/*.ron "$dir/data/"
          cp README.md LICENSE "$dir/"
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/release/client.exe "$dir/open4x.exe"
            7z a "$dir.zip" "$dir" > /dev/null
            echo "ASSET=$dir.zip" >> "$GITHUB_ENV"
          else
            cp target/release/client "$dir/open4x"
            tar czf "$dir.tar.gz" "$dir"
            echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*
          generate_release_notes: true
